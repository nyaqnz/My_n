
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOIR ROUGE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
*{box-sizing:border-box}
:root{--bg:#100b0e;--red:#8e172e;--gold:#c5a46a;--cream:#eee4d2}
body{margin:0;background:var(--bg);color:var(--cream);font-family:Georgia,"Yu Mincho",serif}
body.pokemon{--bg:#e9e8d9;--red:#174b39;--gold:#a58b4d;--cream:#202b24;color:var(--cream)}
header{text-align:center;padding:45px 15px 25px;border-bottom:1px solid var(--gold)}
h1{font-size:38px;letter-spacing:7px;color:var(--gold);margin:0}
.subtitle{font-size:11px;letter-spacing:4px;margin-top:12px}
nav{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;padding:20px 10px}
button{background:transparent;color:var(--gold);border:1px solid var(--gold);padding:10px 17px;font-family:inherit;cursor:pointer}
button:hover{background:var(--gold);color:var(--bg)}
main{max-width:760px;margin:30px auto;padding:0 18px}
.hero{text-align:center;padding:65px 15px;border:1px solid var(--gold);margin-bottom:30px;background:linear-gradient(145deg,transparent,#5a182522)}
.hero h2{font-size:30px;color:var(--gold);letter-spacing:3px}
.hero p{line-height:2}
.panel{border:1px solid var(--gold);padding:20px;margin:20px 0}
input,textarea{width:100%;padding:12px;margin:8px 0;background:#21171b;color:white;border:1px solid var(--gold);font-family:inherit}
textarea{min-height:110px}
body.pokemon input,body.pokemon textarea{background:#f4f1e5;color:#202b24}
.post{border-bottom:1px solid var(--gold);padding:22px 5px;line-height:1.9}
.post img{max-width:100%;max-height:500px;display:block;margin:15px auto}
.small{font-size:12px;opacity:.7}
.hidden{display:none!important}
footer{text-align:center;padding:35px;color:var(--gold);font-size:12px}
#message{color:var(--gold);white-space:pre-wrap}
</style>
</head>

<body>
<header>
<h1>NOIR ROUGE</h1>
<div class="subtitle">PRIVATE DREAM FICTION ARCHIVE</div>
</header>

<nav>
<button onclick="showPage('majestic')">MAJESTIC</button>
<button onclick="showPage('hazbin')">HAZBIN HOTEL</button>
<button onclick="showPage('pokemon')">POKÉMON</button>
</nav>

<main>
<section id="home" class="hero">
<h2>Welcome to my archive</h2>
<p>ここは、夢と物語を綴る秘密の書庫。<br>どうぞ、ごゆっくりお楽しみください。</p>
<p class="small">NOIR ROUGE — operated by 望月</p>
</section>

<section id="login" class="panel">
<h2>ENTRANCE</h2>
<p>合言葉を知る方のみ、お入りいただけます。</p>
<input id="loginPassword" type="password" placeholder="合言葉">
<button onclick="viewerLogin()">ENTER</button>
<p id="message"></p>
</section>

<section id="archive" class="hidden">
<div class="hero">
<p class="small" id="workLabel"></p>
<h2 id="workTitle"></h2>
<p id="workDescription"></p>
</div>

<div id="adminLogin" class="panel">
<h3>OWNER LOGIN</h3>
<input id="adminEmail" type="email" placeholder="管理者メールアドレス">
<input id="adminPassword" type="password" placeholder="管理者パスワード">
<button onclick="adminLogin()">LOGIN</button>
<p id="adminMessage"></p>
</div>

<div id="postForm" class="panel hidden">
<h3>NEW POST</h3>
<textarea id="postBody" placeholder="物語や日記を書く..."></textarea>
<input id="postImage" type="file" accept="image/*">
<button onclick="createPost()">POST</button>
<button onclick="logout()">LOGOUT</button>
<p id="postMessage"></p>
</div>

<div id="posts"></div>
</section>
</main>

<footer>© NOIR ROUGE / 望月</footer>

<script>
const ADMIN_UID = "cc01075a-2c8e-49df-a4f4-fff8a101720e";
const VIEWER_EMAIL = "charakawaii508@gmail.com";
const BUCKET = "site-media";

const works = {
 majestic:{
  label:"MAJESTIC☆MAJOLICAL",
  title:"Shell Celestite",
  description:"Shell Celestite × ミア",
  theme:""
 },
 hazbin:{
  label:"HAZBIN HOTEL",
  title:"ANGEL DUST",
  description:"Angel Dust × ルナ",
  theme:""
 },
 pokemon:{
  label:"POKÉMON",
  title:"N",
  description:"N × アスカ — どこまでも続く、緑の夢。",
  theme:"pokemon"
 }
};

let db;
let currentCategory="majestic";
let isAdmin=false;

function showMessage(id,msg){
 document.getElementById(id).textContent=msg;
}

function showPage(category){
 currentCategory=category;
 document.body.className=works[category].theme;
 document.getElementById("home").classList.add("hidden");
 document.getElementById("login").classList.remove("hidden");
 document.getElementById("archive").classList.add("hidden");
 document.getElementById("workLabel").textContent=works[category].label;
 document.getElementById("workTitle").textContent=works[category].title;
 document.getElementById("workDescription").textContent=works[category].description;
 document.getElementById("posts").innerHTML="";
}

function openArchive(){
 document.getElementById("login").classList.add("hidden");
 document.getElementById("archive").classList.remove("hidden");
 loadPosts();
}

async function viewerLogin(){
 const password=document.getElementById("loginPassword").value;
 if(!db){showMessage("message","設定を確認してください。");return;}
 const {error}=await db.auth.signInWithPassword({
  email:VIEWER_EMAIL,
  password:password
 });
 if(error){showMessage("message","合言葉が違うか、ログインできません。");return;}
 isAdmin=false;
 openArchive();
}

async function adminLogin(){
 const email=document.getElementById("adminEmail").value;
 const password=document.getElementById("adminPassword").value;
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){showMessage("adminMessage","ログインできませんでした。");return;}
 if(data.user.id!==ADMIN_UID){
  await db.auth.signOut();
  showMessage("adminMessage","管理者アカウントではありません。");
  return;
 }
 isAdmin=true;
 document.getElementById("postForm").classList.remove("hidden");
 document.getElementById("adminLogin").classList.add("hidden");
 loadPosts();
}

async function createPost(){
 const body=document.getElementById("postBody").value.trim();
 const file=document.getElementById("postImage").files[0];
 if(!body&&!file){showMessage("postMessage","文章か画像を入力してください。");return;}
 const {data:{user}}=await db.auth.getUser();
 let imagePath=null;
 if(file){
  const safeName=Date.now()+"_"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  const path=user.id+"/"+safeName;
  const {error}=await db.storage.from(BUCKET).upload(path,file);
  if(error){showMessage("postMessage","画像のアップロードに失敗しました。");return;}
  imagePath=path;
 }
 const {error}=await db.from("posts").insert({
  category:currentCategory,
  body:body,
  image_url:imagePath,
  author_id:user.id
 });
 if(error){showMessage("postMessage","投稿できませんでした: "+error.message);return;}
 document.getElementById("postBody").value="";
 document.getElementById("postImage").value="";
 showMessage("postMessage","投稿しました。");
 loadPosts();
}

async function loadPosts(){
 const {data,error}=await db.from("posts")
  .select("*")
  .eq("category",currentCategory)
  .order("created_at",{ascending:false});
 const area=document.getElementById("posts");
 area.innerHTML="";
 if(error){area.textContent="投稿を読み込めませんでした。";return;}
 for(const post of data||[]){
  const article=document.createElement("article");
  article.className="post";
  const date=document.createElement("div");
  date.className="small";
  date.textContent=new Date(post.created_at).toLocaleString("ja-JP");
  const content=document.createElement("p");
  content.textContent=post.body||"";
  article.append(date,content);
  if(post.image_url){
   const {data:imageData}=await db.storage.from(BUCKET).createSignedUrl(post.image_url,3600);
   if(imageData?.signedUrl){
    const img=document.createElement("img");
    img.src=imageData.signedUrl;
    article.appendChild(img);
   }
  }
  if(isAdmin){
   const edit=document.createElement("button");
   edit.textContent="EDIT";
   edit.onclick=()=>editPost(post);
   const del=document.createElement("button");
   del.textContent="DELETE";
   del.onclick=()=>deletePost(post);
   article.append(edit,del);
  }
  area.appendChild(article);
 }
}

async function editPost(post){
 const updated=prompt("投稿内容を編集",post.body||"");
 if(updated===null)return;
 const {error}=await db.from("posts").update({body:updated}).eq("id",post.id);
 if(error){alert("編集できませんでした。");return;}
 loadPosts();
}

async function deletePost(post){
 if(!confirm("この投稿を削除しますか？"))return;
 if(post.image_url){
  await db.storage.from(BUCKET).remove([post.image_url]);
 }
 const {error}=await db.from("posts").delete().eq("id",post.id);
 if(error){alert("削除できませんでした。");return;}
 loadPosts();
}

async function logout(){
 await db.auth.signOut();
 isAdmin=false;
 document.getElementById("postForm").classList.add("hidden");
 document.getElementById("adminLogin").classList.remove("hidden");
 document.getElementById("archive").classList.add("hidden");
 document.getElementById("login").classList.remove("hidden");
}

async function init(){
 const config=window.SUPABASE_CONFIG;
 if(!config?.url||!config?.key){
  showMessage("message","config.jsの設定を確認してください。");
  return;
 }
 db=window.supabase.createClient(config.url,config.key);
 const {data:{session}}=await db.auth.getSession();
 if(session){
  const {data:{user}}=await db.auth.getUser();
  if(user?.id===ADMIN_UID){
   isAdmin=true;
   openArchive();
   document.getElementById("postForm").classList.remove("hidden");
   document.getElementById("adminLogin").classList.add("hidden");
  }
 }
}
init();
</script>
</body>
</html>
